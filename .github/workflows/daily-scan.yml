name: Daily scan

on:
  schedule:
    # Summer-2027 India reqs open Sep-Jan, and the flag is only worth
    # anything inside 48h — so sweep four times a day rather than once.
    # 00:30 / 06:30 / 12:30 / 18:30 UTC = 06:00 / 12:00 / 18:00 / 00:00 IST.
    - cron: "30 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "Also regenerate the weekly report"
        type: boolean
        default: false
      rediscover:
        description: "Re-run ATS board discovery first (slow)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Re-discover ATS boards
        if: ${{ inputs.rediscover }}
        run: npm run discover

      - name: Run the scan
        # Optional: set these repo secrets to keep Applied/Bookmarked state in
        # Upstash/Vercel KV. Without them the scan still runs and state lives
        # in the browser.
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: npm run scan

      - name: Decide whether to build the weekly report
        id: week
        run: |
          # Sunday, and only on the first run of the day, so the report is
          # written once rather than four times.
          if { [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" = "00" ]; } \
             || [ "${{ inputs.force_report }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the weekly report
        if: steps.week.outputs.run == 'true'
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: npm run report

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes this run."
          else
            git commit -m "chore(scan): refresh listings $(date -u +%Y-%m-%d)"
            git push
          fi

      # A newly-opened role is only useful if he hears about it. GitHub emails
      # issues to the repo owner, so this needs no mail secrets of its own.
      - name: Check for roles worth an alert
        id: alert
        run: echo "count=$(npx tsx scripts/notify.ts "$RUNNER_TEMP/alert.md")" >> "$GITHUB_OUTPUT"

      - name: Open an alert issue
        if: steps.alert.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 ${{ steps.alert.outputs.count }} internship(s) opened — $(TZ=Asia/Kolkata date +'%d %b')" \
            --body-file "$RUNNER_TEMP/alert.md" \
            --label "new-roles" || \
          gh issue create \
            --title "🚨 ${{ steps.alert.outputs.count }} internship(s) opened — $(TZ=Asia/Kolkata date +'%d %b')" \
            --body-file "$RUNNER_TEMP/alert.md"

      # The repo is connected to Vercel's Git integration, so the push above
      # already redeploys. This is a fallback for setups without it: add a
      # VERCEL_DEPLOY_HOOK secret and it fires instead.
      # (`secrets` is not available in a step-level `if`, so guard inside run.)
      - name: Trigger Vercel redeploy (optional)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" > /dev/null
            echo "Redeploy hook fired."
          else
            echo "No deploy hook set - Vercel's Git integration handles redeploys."
          fi
